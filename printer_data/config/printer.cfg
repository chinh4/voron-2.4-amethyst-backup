########################################
# Bed Mesh
########################################

# [bed_mesh]
# zero_reference_position: 175, 175 # The centre of your bed. 
# speed: 300
# horizontal_move_z: 3
# mesh_min: 25, 25 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
# mesh_max: 325, 325 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
# probe_count: 32, 32
# mesh_pps: 0,0 

[bed_mesh]
horizontal_move_z: 3
speed: 200
mesh_min: 25, 25 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 325, 325 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 10, 10
algorithm: bicubic
#scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.


########################################
# Quad Gantry Level
########################################

[quad_gantry_level]
horizontal_move_z: 20
min_horizontal_move_z: 2.0
adaptive_horizontal_move_z: true
alternate_probe_direction: true
use_probe_xy_offsets: true
retries: 6
retry_tolerance: 0.0075
max_adjust: 20
speed: 97.5
gantry_corners:
  -60, -10
  410, 420
points:
  50,25
  50,275
  300,275
  300,25

########################################
# Homing
########################################

[safe_z_home]
home_xy_position: 175, 175
z_hop: 7

########################################
# Resonance Testing
########################################

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20

